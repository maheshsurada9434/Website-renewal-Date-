name: Probe sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e +o pipefail; mkdir -p tmp; out=data/probe.txt; : > $out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sSL -m 200 -o tmp/g.zip https://inventory.auctions.godaddy.com/all_listings_ending_today.json.zip
          unzip -p tmp/g.zip | head -c 2600 >> $out; echo >> $out
          unzip -p tmp/g.zip | grep -o '"auctionType": *"[^"]*"' | sort | uniq -c >> $out
          curl -sSL -m 200 -o tmp/s.zip "https://www.snapnames.com/file_dl.sn?file=deletinglist.zip"
          unzip -p tmp/s.zip | head -4 | cut -c1-700 >> $out
          echo "lines: $(unzip -p tmp/s.zip | wc -l)" >> $out
          unzip -p tmp/s.zip | awk -F'\t' 'NR>1{print $3}' | cut -c1-11 | sort | uniq -c | head -12 >> $out
          unzip -p tmp/s.zip | awk -F'\t' 'NR>1{print $7}' | sort | uniq -c | sort -rn | head -15 >> $out
          cat $out
          git config user.name "Mahesh Surada"; git config user.email "36591838+maheshsurada9434@users.noreply.github.com"
          git add data/probe.txt; git commit -m "Probe domain list sources"; git pull --rebase; git push
