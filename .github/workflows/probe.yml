name: Probe sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp; out=data/probe.txt; : > $out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for u in \
            https://www.pool.com/Downloads/PoolDeletingDomainsList.zip \
            https://inventory.auctions.godaddy.com/all_expiring_auctions.json.zip \
            https://inventory.auctions.godaddy.com/tdnam_all_listings.csv.zip \
            https://inventory.auctions.godaddy.com/all_listings_ending_today.json.zip \
            https://inventory.auctions.godaddy.com/expiring_service_auctions.json.zip \
            https://www.snapnames.com/file_dl.sn?file=deletinglist.zip \
            https://www.namejet.com/download/StandardAuctions.csv \
            https://www.dynadot.com/market/backorder/backorders.csv \
            https://tranco-list.eu/top-1m.csv.zip ; do
            f=tmp/$(echo "$u" | md5sum | cut -c1-8)
            code=$(curl -sSL -A "$UA" -m 120 -o $f -w '%{http_code} %{content_type} %{size_download}' "$u" 2>&1)
            echo "== $u -> $code" >> $out
            if file $f | grep -qi zip; then unzip -l $f | head -5 >> $out; unzip -p $f | head -c 600 >> $out; else head -c 400 $f >> $out; fi
            echo >> $out
          done
          cat $out
          git config user.name "Mahesh Surada"; git config user.email "36591838+maheshsurada9434@users.noreply.github.com"
          git add data/probe.txt; git commit -m "Probe domain list sources"; git push
