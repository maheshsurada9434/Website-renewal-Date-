name: Scan and publish
on:
  schedule:
    - cron: '17 2 * * *'   # every day at 07:47 IST
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scan-publish
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check renewal dates
        run: node scripts/scan.mjs
      - name: Save results
        run: |
          git config user.name "Mahesh Surada"
          git config user.email "36591838+maheshsurada9434@users.noreply.github.com"
          git add data/domains.json
          git diff --cached --quiet || (git commit -m "Daily scan $(date -u +%F)" && git push)
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html rdap.js manifest.webmanifest sw.js icons data domains.txt _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
